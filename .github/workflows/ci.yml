name: Nexus Cockpit CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @nexus/desktop
      - run: npm run smoke:reload --workspace @nexus/desktop
      - run: npm audit --omit=dev

  linux-tmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: tmux -V
      # node-pty is Windows-only evidence for now; skip its native build on Linux.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node --test dist/packages/host-agent/test/tmux.test.js
